2026-11-02:
  Runian:
  - rscadd: Beams now appear to move smoothly between two connected things.
  - bugfix: Beams no longer appear off-centered from/to xenomorphs.
  - code_imp: Beams can now have their origin/target pixel offset overridden.
2026-11-03:
  Lumipharon:
  - bugfix: Elevator controls/indicators correctly reflect the actual levels they
      connect to, instead of a hard coded z level reference
  - code_imp: preferred floor names for elevator controls refer to the relative z
      level instead of a hard coded z level
  - balance: Zombies no longer automatically follow friendly players
  - balance: Zombie rally action is now capped to 8 zombie followers
  - bugfix: fixed a footstep run with silent footsteps
  ViperSnake01:
  - balance: Moved nuke on Magmoor into caves.
  novaepee:
  - balance: no more free armorlock; buy Thor armorlock for 120 points at req
2026-11-04:
  Lumipharon:
  - rscadd: Added quick cast support for a vast number of abilities - press the action
      and you use it where you are pointing. Check your keybinds, there are options
      for selection if you prefer the old behavior.
  - code_imp: SSmouse_entered keeps weakrefs of what clients are mousing over, used
      for quick casting
  - code_imp: key presses now have mouse polling, used as a fallback for quick casting
      when the weakref fails
  ViperSnake01:
  - balance: Increased the range for Boiler's long range sight ability.
  - balance: Decreased boilers health from 380 to 350.
  - balance: Decreased boilers melee/bullet/laser/energy/fire armour by 5.
2026-11-05:
  CrimsonLeopard42:
  - balance: Dylovene purges Zombium like any other toxin.
  Lumipharon:
  - imageadd: 'Updated a significant number of projectiles for visual clarity: larger
      bullets for higher damage rounds, red for incendiary and buckshot, green for
      AP and slugs, purple for flechette'
  - rscadd: Added silo collapse as a win condition in sovl war - generators do not
      prevent silo collapse
  - qol: clicking holocades with the build designator action will delete the holocade
  - qol: adding a holocade will replace an existing holocade of the same dir
  - bugfix: fixed a build designator runtime
  - balance: reduced tesla slowdown to 1 from 2
  - balance: Tesla gun has a max target limit of 5 for beams per 0.2 seconds, or 4
      for IFF mode
  - bugfix: fixed tesla beams sometimes not hitting up to their max target limit
  - balance: Tac sensors only pick up stalking xenos within 9 tiles, or walking hostile
      humans within 6 tiles
  - bugfix: Fixed food items not properly clearing from your hand when you finish
      forcefeeding it to someone else
  - qol: You can once again overeat - with a channel time - if you wish
  - balance: Being fat reduces throw distance for humans - for all types of throws
  - bugfix: The remaining Thor modules smuggled into vendors have been collected by
      requisition agents
  - balance: Railgun has a fire delay of 1 second instead of 2. Reload delay is unchanged,
      so this should only effect the ability to fire another weapon after the railgun.
  Notamaniac:
  - bugfix: Fixes a few camera blindspots on the Pillar of Spring. The AI can now
      use the FOB console there without a marine nearby!
  Runian:
  - rscadd: Any xenomorph builder castes can now pick up healing, armor, and plasma
      plants as an single-use item. This is done via drag-and-drop.
  - rscadd: Held xenomorph plants can be consumed in-hand, fed to others, thrown to
      trigger destruction effects, or re-planted elsewhere.
  - bugfix: Xenomorph armor plant now throws humans away from the plant, rather than
      opposite of the direction their facing, when destroyed.
  - bugfix: All xenomorph builder castes can now destroy xenomorph plants, instead
      of exclusively drones.
  - imageadd: Xenomorph healing, armor, and plasma plant item sprites.
  - balance: Critical xenomorphs now immediately die if their off-weeds bleed out
      damage is enough to kill them.
  - balance: Critical xenomorphs now immediately leave critical if their on-weeds
      healing is enough to heal them out of it.
  sylvia-from-fulp-station:
  - rscadd: adds red, blue and purple plaid skirts to synth vendor
